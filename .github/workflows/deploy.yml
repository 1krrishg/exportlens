name: Deploy Supabase Functions

# Automatic deploy-on-push is switched off: the SUPABASE_PROJECT_ID and
# SUPABASE_ACCESS_TOKEN repo secrets were never set, so every push failed.
# Functions are deployed with the Supabase CLI instead. To turn it back on,
# add those two secrets and restore the push trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
